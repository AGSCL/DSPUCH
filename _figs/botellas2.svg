<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8B4513" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#A0522D" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#8B4513" stop-opacity="0.7"/>
        </linearGradient>
        <linearGradient id="liquidGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5D4037" stop-opacity="0.8"/>
            <stop offset="50%" stop-color="#6D4C41" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#5D4037" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="corkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#DEB887"/>
            <stop offset="100%" stop-color="#A0522D"/>
        </linearGradient>
        <linearGradient id="labelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F5F5DC"/>
            <stop offset="100%" stop-color="#E6D6B3"/>
        </linearGradient>
        <linearGradient id="reflection" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
            <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.2"/>
            <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
        </filter>
    </defs>

    <!-- Botella 1 (Whisky) -->
    <g transform="translate(150, 80) rotate(20)" filter="url(#shadow)">
        <!-- Cuerpo de la botella -->
        <path d="M40 0 C60 -10, 80 0, 80 20 L80 180 C80 200, 60 210, 40 200 L40 0 Z" fill="url(#glassGradient)"/>
        
        <!-- Líquido -->
        <path d="M40 50 C60 40, 80 50, 80 70 L80 180 C80 200, 60 210, 40 200 L40 50 Z" fill="url(#liquidGradient)"/>
        
        <!-- Base -->
        <ellipse cx="60" cy="200" rx="25" ry="8" fill="#3E2723" opacity="0.8"/>
        
        <!-- Cuello -->
        <rect x="50" y="-25" width="20" height="25" fill="url(#glassGradient)"/>
        
        <!-- Tapón -->
        <rect x="52" y="-35" width="16" height="10" fill="url(#corkGradient)" rx="2"/>
        
        <!-- Etiqueta -->
        <rect x="45" y="80" width="30" height="50" fill="url(#labelGradient)" rx="2"/>
        <text x="60" y="105" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#5D4037" font-weight="bold">WHISKY</text>
        <text x="60" y="120" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#8D6E63">AGED 12</text>
        <text x="60" y="130" font-family="Georgia, serif" font-size="8" text-anchor="middle" fill="#8D6E63">YEARS</text>
        
        <!-- Reflejos -->
        <path d="M45 20 L65 10 L65 170 L45 180 Z" fill="url(#reflection)"/>
    </g>

    <!-- Botella 2 (Brandy) -->
    <g transform="translate(350, 100) rotate(-20)" filter="url(#shadow)">
        <!-- Cuerpo de la botella -->
        <path d="M30 0 C50 -15, 70 0, 70 25 L70 190 C70 210, 50 220, 30 210 L30 0 Z" fill="url(#glassGradient)"/>
        
        <!-- Líquido -->
        <path d="M30 60 C50 45, 70 60, 70 85 L70 190 C70 210, 50 220, 30 210 L30 60 Z" fill="url(#liquidGradient)"/>
        
        <!-- Base -->
        <ellipse cx="50" cy="210" rx="22" ry="7" fill="#3E2723" opacity="0.8"/>
        
        <!-- Cuello -->
        <rect x="43" y="-20" width="14" height="20" fill="url(#glassGradient)"/>
        
        <!-- Tapón -->
        <rect x="44" y="-30" width="12" height="10" fill="url(#corkGradient)" rx="2"/>
        
        <!-- Etiqueta -->
        <rect x="35" y="100" width="30" height="45" fill="url(#labelGradient)" rx="2"/>
        <text x="50" y="120" font-family="Georgia, serif" font-size="9" text-anchor="middle" fill="#5D4037" font-weight="bold">BRANDY</text>
        <text x="50" y="135" font-family="Georgia, serif" font-size="7" text-anchor="middle" fill="#8D6E63">V.S.O.P.</text>
        
        <!-- Reflejos -->
        <path d="M35 30 L55 15 L55 180 L35 190 Z" fill="url(#reflection)"/>
    </g>

    <!-- Efecto de brindis en el punto de cruce -->
    <g>
        <!-- Resplandor -->
        <circle cx="300" cy="200" r="15" fill="#FFD700" opacity="0.3"/>
        
        <!-- Partículas de celebración -->
        <circle cx="280" cy="180" r="2" fill="#FFFFFF" opacity="0.7"/>
        <circle cx="320" cy="220" r="2" fill="#FFFFFF" opacity="0.7"/>
        <circle cx="310" cy="175" r="2" fill="#FFFFFF" opacity="0.7"/>
    </g>
</svg>