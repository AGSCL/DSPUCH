<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <!-- Marco principal -->
  <rect x="10" y="20" width="80" height="70" rx="6" ry="6" stroke="#000" stroke-width="2.5" fill="none"/>

  <!-- Línea superior (separador del encabezado) -->
  <line x1="10" y1="35" x2="90" y2="35" stroke="#000" stroke-width="2"/>

  <!-- Aros del calendario -->
  <line x1="25" y1="15" x2="25" y2="25" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="15" x2="50" y2="25" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="15" x2="75" y2="25" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cuadrícula de días -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="25" y1="45" x2="25" y2="80"/>
    <line x1="45" y1="45" x2="45" y2="80"/>
    <line x1="65" y1="45" x2="65" y2="80"/>
    <line x1="85" y1="45" x2="85" y2="80"/>
    <line x1="10" y1="55" x2="90" y2="55"/>
    <line x1="10" y1="65" x2="90" y2="65"/>
    <line x1="10" y1="75" x2="90" y2="75"/>
  </g>
</svg>

