<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Chalk Outline (dark bg)</title>
  <!-- Fondo oscuro opcional: quítalo si no lo necesitas -->
  <rect width="100%" height="100%" fill="#0e0e0e"></rect>
  <defs>
    <!-- Resplandor suave para que destaque -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 9" filter="url(#glow)">
    <!-- cabeza -->
    <circle cx="112" cy="72" r="14"></circle>
    <!-- cuerpo y extremidades -->
    <polyline points="112,86 112,116 94,128 104,146 124,132 138,154 154,144 138,120 156,106 142,92"></polyline>
  </g>
</svg>
