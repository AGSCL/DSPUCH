<svg width="500" height="180" viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo blanco -->
  <rect width="500" height="180" fill="white"/>

  <!-- ============ PASTILLA ============ -->
  <g transform="translate(80, 90)">
    <!-- Cuerpo de la cápsula (relleno blanco, contorno negro) -->
    <rect x="-25" y="-8" width="50" height="16" rx="8" ry="8" fill="white" stroke="black" stroke-width="1.5"/>
    <!-- Mitad izquierda (sombra sutil o división) -->
    <line x1="-25" y1="-8" x2="-25" y2="8" stroke="black" stroke-width="1.5"/>
    <line x1="-25" y1="0" x2="0" y2="0" stroke="black" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- ============ PIPA (estilo clásico, elegante) ============ -->
  <g transform="translate(250, 100)">
    <!-- Cazoleta (forma de tazón) -->
    <path d="M -12 0 A 12 18 0 1 1 12 0 Z" fill="white" stroke="black" stroke-width="1.5"/>
    <!-- Caña curva -->
    <path d="M 12 0 Q 30 5 35 20 Q 40 40 30 55" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
    <!-- Boquilla (remate) -->
    <circle cx="30" cy="55" r="4" fill="white" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- ============ COPA DE VINO ============ -->
  <g transform="translate(420, 110)">
    <!-- Copa (forma de U suave) -->
    <path d="M -18 0 Q 0 -35 18 0" fill="none" stroke="black" stroke-width="2"/>
    <!-- Interior de la copa (líquido sugerido) -->
    <path d="M -14 2 Q 0 -25 14 2" fill="none" stroke="black" stroke-width="1" opacity="0.5"/>
    <!-- Tallo -->
    <line x1="0" y1="0" x2="0" y2="25" stroke="black" stroke-width="2"/>
    <!-- Base -->
    <ellipse cx="0" cy="25" rx="12" ry="3" fill="none" stroke="black" stroke-width="2"/>
  </g>
</svg>
